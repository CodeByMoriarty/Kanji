<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 18 文型レビュー</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F3ECDD;
    --ink:#2A241C;
    --accent:#B5871D;
    --accent-deep:#8C6A16;
    --indigo:#33506A;
    --line:#E7D9B0;
  }
  body{ background:var(--paper); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .paper-texture{
    background-image:
      radial-gradient(circle at 20% 15%, rgba(181,135,29,0.07), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(51,80,106,0.05), transparent 45%);
  }
  ruby{ ruby-position: over; }
  rt{ font-size:0.55em; color:inherit; opacity:.75; font-weight:400; }
  .scene{ perspective:1600px; }
  .flip-card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:10px;
  }
  .face-back{ transform:rotateY(180deg); overflow-y:auto; }
  .chip{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:999px;
    font-size:11px; letter-spacing:.03em;
    background:var(--accent); color:#fff;
  }
  .num-badge{
    width:22px; height:22px; border-radius:999px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; flex-shrink:0;
  }
  .progress-track{ background:var(--line); }
  .progress-fill{ background:var(--accent); transition:width .3s ease; }
  .ctrl-btn{
    border:1px solid var(--line); background:var(--paper);
    transition:background .15s ease, border-color .15s ease;
  }
  .ctrl-btn:hover{ background:var(--paper-deep); border-color:var(--accent); }
  .ctrl-btn:active{ transform:translateY(1px); }
  .example-card{
    background:rgba(251,246,236,0.06);
    border:1px solid rgba(251,246,236,0.14);
    border-radius:8px;
  }
  .speak-mini{
    width:26px; height:26px; border-radius:999px;
    border:1px solid rgba(251,246,236,0.3);
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); flex-shrink:0;
  }
  .speak-mini:hover{ background:rgba(251,246,236,0.12); }
  @media (prefers-reduced-motion: reduce){
    .flip-card{ transition:none; }
  }
</style>
</head>
<body class="min-h-screen paper-texture text-[var(--ink)] flex flex-col items-center px-4 py-8 sm:px-5 sm:py-10">

  <!-- back to index -->
  <a href="index.html" class="w-full max-w-md text-xs text-[var(--indigo)] hover:text-[var(--accent-deep)] transition-colors mb-4 inline-flex items-center gap-1">
    <span aria-hidden="true">←</span> 一覧に戻る
  </a>

  <!-- header -->
  <div class="w-full max-w-md flex items-baseline justify-between mb-1">
    <div>
      <p class="text-xs tracking-wide text-[var(--accent-deep)]">Irodori 3・文型レビュー</p>
      <h1 class="text-xl font-bold">Lesson 18 文型レビュー</h1>
    </div>
    <p id="counter" class="text-sm text-[var(--ink)]/60">1 / 5</p>
  </div>

  <!-- progress -->
  <div class="w-full max-w-md h-[3px] progress-track rounded-full mb-8 overflow-hidden">
    <div id="progressFill" class="h-full progress-fill" style="width:20%"></div>
  </div>

  <!-- card -->
  <div class="scene w-full max-w-md h-96 sm:h-[26rem] cursor-pointer select-none" id="cardScene">
    <div class="flip-card" id="flipCard">

      <!-- front -->
      <div class="face face-front bg-white border border-[var(--line)] shadow-[0_10px_30px_-14px_rgba(42,36,28,0.35)] flex flex-col items-center justify-center px-6">
        <div class="absolute top-4 left-4 chip">Lesson 18</div>
        <div id="numBadge" class="absolute top-4 right-4 num-badge">1</div>
        <p id="patternText" class="font-bold text-2xl sm:text-3xl leading-snug text-center"></p>
        <p class="absolute bottom-5 text-xs text-[var(--ink)]/40 tracking-wide">タップして例文を見る</p>
      </div>

      <!-- back -->
      <div class="face face-back bg-[var(--indigo)] text-[var(--paper)] flex flex-col px-6 py-6">
        <p id="explanationText" class="text-sm leading-relaxed mb-4 text-[var(--paper)]/90"></p>
        <div class="w-10 h-[2px] mb-4" style="background:var(--accent);"></div>
        <div id="examplesList" class="flex flex-col gap-3 text-sm overflow-y-auto"></div>
      </div>

    </div>
  </div>

  <!-- controls -->
  <div class="w-full max-w-md flex items-center justify-between mt-8 gap-3">
    <button id="prevBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">← 前</button>
    <button id="shuffleBtn" class="ctrl-btn px-4 py-3 rounded text-sm">シャッフル</button>
    <button id="nextBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">次 →</button>
  </div>

  <p class="text-xs text-[var(--ink)]/40 mt-6">タップで裏返す・矢印キーで移動・スピーカーで発音</p>

<script>
  // [pattern, explanation, [[jp_with_furigana_markup, jp_plain_for_speech, en], ...]]
  // furigana markup: {kanji|reading}
  const patterns = [
    ["V-（よ）うと思います／思っています", "States an intention or plan — “I'm thinking of ~ing.”", [["{将来|しょうらい}は、タイで、{自分|じぶん}の{会社|かいしゃ}を{作|つく}ろうと{思|おも}います。", "将来は、タイで、自分の会社を作ろうと思います。", "In the future, I'm thinking of starting my own company in Thailand."], ["{来年|らいねん}、{国|くに}に{帰|かえ}ろうと{思|おも}っています。", "来年、国に帰ろうと思っています。", "I'm thinking of going back to my country next year."], ["{日本語|にほんご}をもっと{勉強|べんきょう}しようと{思|おも}います。", "日本語をもっと勉強しようと思います。", "I'm thinking of studying Japanese more."]]],
    ["V-るために、～", "States the purpose of an action — “in order to ~.”", [["{日本|にほん}に{住|す}むために、もっと{日本語|にほんご}をがんばろうと{思|おも}います。", "日本に住むために、もっと日本語をがんばろうと思います。", "In order to live in Japan, I'm going to work harder at Japanese."], ["{試験|しけん}に{合格|ごうかく}するために、{毎日|まいにち}{勉強|べんきょう}します。", "試験に合格するために、毎日勉強します。", "I study every day in order to pass the exam."], ["{健康|けんこう}のために、{野菜|やさい}を{食|た}べるようにしています。", "健康のために、野菜を食べるようにしています。", "I make sure to eat vegetables for my health."]]],
    ["V-てあげます", "Describes doing something for someone else's benefit — “do ~ for (someone).”", [["{両親|りょうしん}に、{家|いえ}を{建|た}ててあげるつもりです。", "両親に、家を建ててあげるつもりです。", "I plan to build a house for my parents."], ["{友|とも}だちに{本|ほん}を{貸|か}してあげました。", "友だちに本を貸してあげました。", "I lent a book to my friend."], ["{子|こ}どもに{料理|りょうり}を{作|つく}ってあげます。", "子どもに料理を作ってあげます。", "I'll make food for my child."]]],
    ["V-てもらいます", "Describes receiving the favor of someone doing something for you — “have (someone) do ~ for me.”", [["JF{工業|こうぎょう}のみなさんには、とても{親切|しんせつ}にしてもらいました。", "JF工業のみなさんには、とても親切にしてもらいました。", "Everyone at JF Industries was very kind to me."], ["{友|とも}だちに{日本語|にほんご}を{教|おし}えてもらいました。", "友だちに日本語を教えてもらいました。", "I had a friend teach me Japanese."], ["{先生|せんせい}に{作文|さくぶん}を{直|なお}してもらいました。", "先生に作文を直してもらいました。", "I had my teacher correct my composition."]]],
    ["V-てくれます", "Describes someone doing something for you, out of their own kindness — “do ~ for me.”", [["{山内|やまうち}さんは、{私|わたし}にたくさん、{日本語|にほんご}を{教|おし}えてくれました。", "山内さんは、私にたくさん、日本語を教えてくれました。", "Yamauchi-san taught me a lot of Japanese."], ["{母|はは}が{荷物|にもつ}を{送|おく}ってくれました。", "母が荷物を送ってくれました。", "My mother sent me a package."], ["{同僚|どうりょう}が{仕事|しごと}を{手伝|てつだ}ってくれました。", "同僚が仕事を手伝ってくれました。", "A coworker helped me with my work."]]]
  ];

  function furiganaToHtml(text){
    return text.replace(/\{([^|]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  }

  let order = patterns.map((_, i) => i);
  let pos = 0;
  let flipped = false;

  const flipCard = document.getElementById('flipCard');
  const cardScene = document.getElementById('cardScene');
  const patternText = document.getElementById('patternText');
  const numBadge = document.getElementById('numBadge');
  const explanationText = document.getElementById('explanationText');
  const examplesList = document.getElementById('examplesList');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
  }

  function render(){
    const [pattern, explanation, examples] = patterns[order[pos]];
    patternText.innerHTML = furiganaToHtml(pattern);
    numBadge.textContent = pos + 1;
    explanationText.textContent = explanation;
    examplesList.innerHTML = examples.map(([jpMarkup, jpPlain, en], i) => `
      <div class="example-card p-3">
        <div class="flex items-start justify-between gap-2 mb-1">
          <div class="flex items-start gap-2">
            <span class="num-badge mt-0.5">${i + 1}</span>
            <p class="leading-relaxed">${furiganaToHtml(jpMarkup)}</p>
          </div>
          <button class="speak-mini speak-example" data-text="${jpPlain.replace(/"/g, '&quot;')}" aria-label="発音を聞く" title="発音を聞く">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
              <path d="M3 10v4h4l5 5V5L7 10H3z"/>
              <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/>
            </svg>
          </button>
        </div>
        <p class="text-[var(--paper)]/70 text-xs pl-7">${en}</p>
      </div>
    `).join('');
    examplesList.querySelectorAll('.speak-example').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        speak(btn.dataset.text);
      });
    });
    counter.textContent = `${pos + 1} / ${patterns.length}`;
    progressFill.style.width = `${((pos + 1) / patterns.length) * 100}%`;
  }

  function setFlipped(state){
    flipped = state;
    flipCard.classList.toggle('flipped', flipped);
  }

  function go(delta){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    setFlipped(false);
    pos = (pos + delta + order.length) % order.length;
    setTimeout(render, delta === 0 ? 0 : 120);
  }

  function shuffle(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    setFlipped(false);
    render();
  }

  cardScene.addEventListener('click', () => setFlipped(!flipped));
  document.getElementById('prevBtn').addEventListener('click', () => go(-1));
  document.getElementById('nextBtn').addEventListener('click', () => go(1));
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); setFlipped(!flipped); }
    if(e.code === 'ArrowRight'){ go(1); }
    if(e.code === 'ArrowLeft'){ go(-1); }
  });

  render();
</script>
</body>
</html>
