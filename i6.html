<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第6課 ことばカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F3ECDD;
    --ink:#2A241C;
    --seal:#A2403B;
    --indigo:#33506A;
    --gold:#B4893F;
    --line:#DED2B6;
  }
  body{ background:var(--paper); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .serif{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .paper-texture{
    background-image:
      radial-gradient(circle at 20% 15%, rgba(180,137,63,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(51,80,106,0.05), transparent 45%);
  }
  .scene{ perspective:1600px; }
  .flip-card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:6px;
  }
  .face-back{ transform:rotateY(180deg); }
  .seal{
    width:44px; height:44px; border:2px solid var(--seal); color:var(--seal);
    border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:11px; letter-spacing:.05em; transform:rotate(2deg);
  }
  .progress-track{ background:var(--line); }
  .progress-fill{ background:var(--seal); transition:width .3s ease; }
  .ctrl-btn{
    border:1px solid var(--line); background:var(--paper);
    transition:background .15s ease, border-color .15s ease;
  }
  .ctrl-btn:hover{ background:var(--paper-deep); border-color:var(--gold); }
  .ctrl-btn:active{ transform:translateY(1px); }
  @media (prefers-reduced-motion: reduce){
    .flip-card{ transition:none; }
  }
</style>
</head>
<body class="min-h-screen paper-texture text-[var(--ink)] flex flex-col items-center px-5 py-10">

  <!-- back to index -->
  <a href="index.html" class="w-full max-w-md text-xs text-[var(--indigo)] hover:text-[var(--seal)] transition-colors mb-4 inline-flex items-center gap-1">
    <span aria-hidden="true">←</span> 一覧に戻る
  </a>

  <!-- header -->
  <div class="w-full max-w-md flex items-baseline justify-between mb-1">
    <div>
      <p class="text-xs tracking-wide text-[var(--indigo)]">いろどり1</p>
      <h1 class="serif text-xl font-bold">第6課 ことばカード</h1>
    </div>
    <p id="counter" class="text-sm text-[var(--ink)]/60 serif">1 / 23</p>
  </div>

  <!-- progress -->
  <div class="w-full max-w-md h-[3px] progress-track rounded-full mb-8 overflow-hidden">
    <div id="progressFill" class="h-full progress-fill" style="width:4.3%"></div>
  </div>

  <!-- card -->
  <div class="scene w-full max-w-md h-72 sm:h-80 cursor-pointer select-none" id="cardScene">
    <div class="flip-card" id="flipCard">

      <!-- front -->
      <div class="face face-front bg-white border border-[var(--line)] shadow-[0_10px_30px_-14px_rgba(42,36,28,0.35)] flex flex-col items-center justify-center px-6">
        <div class="absolute top-4 right-4 seal">第6課</div>
        <p id="kanjiText" class="serif font-bold text-6xl sm:text-7xl leading-none">動物園</p>
        <p class="absolute bottom-5 text-xs text-[var(--ink)]/40 tracking-wide">タップして裏を見る</p>
      </div>

      <!-- back -->
      <div class="face face-back bg-[var(--indigo)] text-[var(--paper)] flex flex-col items-center justify-center px-8">
        <p id="readingText" class="serif text-2xl sm:text-3xl mb-4 tracking-wide">どうぶつえん</p>
        <button id="speakBtn" class="mb-3 w-10 h-10 rounded-full border border-[var(--paper)]/30 flex items-center justify-center text-[var(--paper)] hover:bg-white/10 active:scale-95 transition" aria-label="発音を聞く" title="発音を聞く">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path d="M3 10v4h4l5 5V5L7 10H3z"/>
            <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/>
            <path d="M14 4.13v2.06a7 7 0 0 1 0 11.62v2.06a9 9 0 0 0 0-15.74z"/>
          </svg>
        </button>
        <div class="w-10 h-[2px] bg-[var(--gold)] mb-4"></div>
        <p id="meaningText" class="text-xl sm:text-2xl font-medium text-center">zoo</p>
        <p id="kanjiSmall" class="serif absolute bottom-5 text-sm text-[var(--paper)]/50">動物園</p>
      </div>

    </div>
  </div>

  <!-- controls -->
  <div class="w-full max-w-md flex items-center justify-between mt-8 gap-3">
    <button id="prevBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">← 前</button>
    <button id="shuffleBtn" class="ctrl-btn px-4 py-3 rounded text-sm">シャッフル</button>
    <button id="nextBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">次 →</button>
  </div>

  <p class="text-xs text-[var(--ink)]/40 mt-6">スペースキーで裏返す・矢印キーで移動</p>
  <p class="text-xs text-[var(--ink)]/30 mt-2">Made by <a href="https://andrewl.cv" target="_blank" rel="noopener" class="underline hover:text-[var(--seal)] transition-colors">DORU</a></p>

<script>
  const words = [
    ["~発","~はつ","depart at ~"],
    ["~着","~ちゃく","arrive at ~"],
    ["~号","~ごう","train number ~"],
    ["~号車","~ごうしゃ","train car number ~"],
    ["~席","~せき","~ seat"],
    ["特急券","とっきゅうけん","limited express ticket"],
    ["秋田","あきた","Akita"],
    ["こまち","こまち","Komachi (a type of Shinkansen)"],
    ["通路側","つうろがわ","aisle seat"],
    ["窓側","まどがわ","window seat"],
    ["遅れ","おくれ","delay"],
    ["約","やく","about (e.g. about 10 minutes)"],
    ["~両編成","~りょうへんせい","made up of ~ carriages (e.g. made up of 10 carriages)"],
    ["運転見合わせ","うんてんみあわせ","suspended"],
    ["お知らせ","おしらせ","notice"],
    ["台風～号","たいふう～ごう","typhoon no. ~"],
    ["接近","せっきん","approach"],
    ["~に伴い","~にともない","as a result of ~"],
    ["見合わせる","みあわせる","to postpone"],
    ["ゆば","ゆば","yuba (tofu skin)"],
    ["外国","がいこく","foreign country"],
    ["~泊","~はく","~ night(s) stay (e.g. one-night stay)"],
    ["名物","めいぶつ","local specialty"],
    ["東照宮","とうしょうぐう","Toshogu Shrine"],
    ["中禅寺湖","ちゅうぜんじこ","Chuzenji Lake"],
    ["指定席","していせき","reserved seat"],
    ["自由席","じゆうせき","non-reserved seat"],
    ["~番乗り場","~ばんのりば","platform number ~ / stand number ~"],
    ["~番線","~ばんせん","platform number ~"],
    ["~行き","~いき","bound for ~"],
    ["~線","~せん","~ Line"],
    ["~方面","~ほうめん","towards ~"],
    ["発車する","はっしゃする","to depart"],
    ["到着する","とうちゃくする","to arrive"],
    ["乗り換える","のりかえる","to transfer"],
    ["特急","とっきゅう","limited express"],
    ["~両","~りょう","~ -car train (e.g. nine-car train)"],
    ["順","じゅん","in order of"],
    ["グリーン車","グリーンしゃ","green car"],
    ["金沢","かなざわ","Kanazawa"],
    ["列車","れっしゃ","train"],
    ["乗車/ご乗車","じょうしゃ","get on a train"],
    ["~ほど","~ほど","about ~ (e.g. about 3 minutes)"],
    ["岡山","おかやま","Okayama"],
    ["お出口","おでぐち","exit (polite expression)"],
    ["左側","ひだりがわ","left-hand side"],
    ["各駅","かくえき","each station"],
    ["向かい側","むかいがわ","opposite side"],
    ["中ほど","なかほど","middle"],
    ["ご案内をいたします","ごあんないをいたします","This is an announcement. (polite expression)"],
    ["お越しください","おこしください","Please head to ~ . (polite expression)"],
    ["事故","じこ","accident"],
    ["壊れる","こわれる","to break"],
    ["信号","しんごう","traffic lights"],
    ["信号故障","しんごうこしょう","signal failure"],
    ["アナウンス","アナウンス","announcement"],
    ["困る","こまる","to be troubled"],
    ["何て言ってましたか？","なんていってましたか？","What was it saying?"],
    ["当駅","とうえき","this station"],
    ["~のため","~のため","due to ~"],
    ["運転","うんてん","(train) operations"],
    ["お急ぎのところ","おいそぎのところ","when you may be in a rush (polite expression)"],
    ["お知らせいたします","おしらせいたします","This is an announcement. (polite expression)"],
    ["行っております","おこなっております","~ are conducting. (polite expression for しています)"],
    ["ご迷惑をおかけします","ごめいわくをおかけします","Sorry for the inconvenience. (polite expression)"],
    ["人身事故","じんしんじこ","fatal or serious accident"],
    ["影響","えいきょう","impact"],
    ["全線","ぜんせん","all lines"],
    ["お越し","おこし","heading to (polite expression)"],
    ["ご利用ください","ごりようください","Please use. (polite expression)"],
    ["感動する","かんどうする","to be deeply moved"],
    ["気持ちいい","きもちいい","refreshing"],
    ["残念","ざんねん","disappointing"],
    ["疲れる","つかれる","to get tired"],
    ["びっくりする","びっくりする","to be shocked"],
    ["驚く","おどろく","to be surprised"],
    ["こわい","こわい","scary"],
    ["よかった","よかった","It was good."],
    ["大阪","おおさか","Osaka"],
    ["串カツ","くしカツ","kushi-katsu (skewered cutlet)"],
    ["たこ焼き","たこやき","takoyaki (octopus dumpling balls)"],
    ["登る","のぼる","to go up"],
    ["あべのハルカス","あべのハルカス","Abeno Harukas (building name)"],
    ["大阪城","おおさかじょう","Osaka Castle"],
    ["通天閣","つうてんかく","Tsutenkaku Tower"],
    ["鳥","とり","bird"],
    ["あげる","あげる","to give"],
    ["つり","つり","fishing"],
    ["空","そら","sky"],
    ["ウミネコ","ウミネコ","black-tailed gull"],
    ["あの辺","あのへん","around there"],
    ["浄土ヶ浜","じょうどがはま","Jodogahama Beach"],
    ["ケーブルカー","ケーブルカー","cable car"],
    ["歩く","あるく","to walk"],
    ["リス","リス","squirrel"],
    ["だから","だから","that is why"],
    ["あきらめる","あきらめる","to give up"],
    ["頂上","ちょうじょう","summit"],
    ["高尾山","たかおさん","Mt. Takao"],
    ["町並み","まちなみ","streetscape"],
    ["花畑","はなばたけ","field of flowers"],
    ["イルミネーション","イルミネーション","illumination"],
    ["ショー","ショー","show"],
    ["滝","たき","waterfalls"],
    ["きらきら","きらきら","sparkling"],
    ["光る","ひかる","to shine"],
    ["ハウステンボス","ハウステンボス","Huis Ten Bosch"],
    ["オランダ","オランダ","the Netherlands"],
    ["インスタントラーメン","インスタントラーメン","instant noodles"],
    ["描く","かく","to draw (a picture)"],
    ["カップラーメン","カップラーメン","cup ramen"],
    ["絵","え","picture"],
    ["トッピング","トッピング","toppings"]
  ];

  let order = words.map((_, i) => i);
  let pos = 0;
  let flipped = false;

  const flipCard = document.getElementById('flipCard');
  const cardScene = document.getElementById('cardScene');
  const kanjiText = document.getElementById('kanjiText');
  const kanjiSmall = document.getElementById('kanjiSmall');
  const readingText = document.getElementById('readingText');
  const meaningText = document.getElementById('meaningText');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  document.getElementById('speakBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const [, reading] = words[order[pos]];
    speak(reading);
  });

  function render(){
    const [kanji, reading, meaning] = words[order[pos]];
    kanjiText.textContent = kanji;
    kanjiSmall.textContent = kanji;
    readingText.textContent = reading;
    meaningText.textContent = meaning;
    counter.textContent = `${pos + 1} / ${words.length}`;
    progressFill.style.width = `${((pos + 1) / words.length) * 100}%`;
  }

  function setFlipped(state){
    flipped = state;
    flipCard.classList.toggle('flipped', flipped);
  }

  function go(delta){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    setFlipped(false);
    pos = (pos + delta + order.length) % order.length;
    setTimeout(render, delta === 0 ? 0 : 120);
  }

  function shuffle(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    setFlipped(false);
    render();
  }

  cardScene.addEventListener('click', () => setFlipped(!flipped));
  document.getElementById('prevBtn').addEventListener('click', () => go(-1));
  document.getElementById('nextBtn').addEventListener('click', () => go(1));
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); setFlipped(!flipped); }
    if(e.code === 'ArrowRight'){ go(1); }
    if(e.code === 'ArrowLeft'){ go(-1); }
  });

  render();
</script>
</body>
</html>
