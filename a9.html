<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第9課 ことばカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F3ECDD;
    --ink:#2A241C;
    --seal:#A2403B;
    --indigo:#33506A;
    --gold:#B4893F;
    --line:#DED2B6;
  }
  body{ background:var(--paper); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .serif{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .paper-texture{
    background-image:
      radial-gradient(circle at 20% 15%, rgba(180,137,63,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(51,80,106,0.05), transparent 45%);
  }
  .scene{ perspective:1600px; }
  .flip-card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:6px;
  }
  .face-back{ transform:rotateY(180deg); }
  .seal{
    width:44px; height:44px; border:2px solid var(--seal); color:var(--seal);
    border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:11px; letter-spacing:.05em; transform:rotate(2deg);
  }
  .progress-track{ background:var(--line); }
  .progress-fill{ background:var(--seal); transition:width .3s ease; }
  .ctrl-btn{
    border:1px solid var(--line); background:var(--paper);
    transition:background .15s ease, border-color .15s ease;
  }
  .ctrl-btn:hover{ background:var(--paper-deep); border-color:var(--gold); }
  .ctrl-btn:active{ transform:translateY(1px); }
  @media (prefers-reduced-motion: reduce){
    .flip-card{ transition:none; }
  }
</style>
</head>
<body class="min-h-screen paper-texture text-[var(--ink)] flex flex-col items-center px-5 py-10">

  <!-- back to index -->
  <a href="index.html" class="w-full max-w-md text-xs text-[var(--indigo)] hover:text-[var(--seal)] transition-colors mb-4 inline-flex items-center gap-1">
    <span aria-hidden="true">←</span> 一覧に戻る
  </a>

  <!-- header -->
  <div class="w-full max-w-md flex items-baseline justify-between mb-1">
    <div>
      <p class="text-xs tracking-wide text-[var(--indigo)]">いろどり2</p>
      <h1 class="serif text-xl font-bold">第9課 ことばカード</h1>
    </div>
    <p id="counter" class="text-sm text-[var(--ink)]/60 serif">1 / 64</p>
  </div>

  <!-- progress -->
  <div class="w-full max-w-md h-[3px] progress-track rounded-full mb-8 overflow-hidden">
    <div id="progressFill" class="h-full progress-fill" style="width:1.6%"></div>
  </div>

  <!-- card -->
  <div class="scene w-full max-w-md h-72 sm:h-80 cursor-pointer select-none" id="cardScene">
    <div class="flip-card" id="flipCard">

      <!-- front -->
      <div class="face face-front bg-white border border-[var(--line)] shadow-[0_10px_30px_-14px_rgba(42,36,28,0.35)] flex flex-col items-center justify-center px-6">
        <div class="absolute top-4 right-4 seal">第9課</div>
        <p id="kanjiText" class="serif font-bold text-5xl sm:text-6xl leading-tight text-center">日本語学校</p>
        <p class="absolute bottom-5 text-xs text-[var(--ink)]/40 tracking-wide">タップして裏を見る</p>
      </div>

      <!-- back -->
      <div class="face face-back bg-[var(--indigo)] text-[var(--paper)] flex flex-col items-center justify-center px-8">
        <p id="readingText" class="serif text-2xl sm:text-3xl mb-4 tracking-wide text-center">にほんごがっこう</p>
        <button id="speakBtn" class="mb-3 w-10 h-10 rounded-full border border-[var(--paper)]/30 flex items-center justify-center text-[var(--paper)] hover:bg-white/10 active:scale-95 transition" aria-label="発音を聞く" title="発音を聞く">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path d="M3 10v4h4l5 5V5L7 10H3z"/>
            <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/>
            <path d="M14 4.13v2.06a7 7 0 0 1 0 11.62v2.06a9 9 0 0 0 0-15.74z"/>
          </svg>
        </button>
        <div class="w-10 h-[2px] bg-[var(--gold)] mb-4"></div>
        <p id="meaningText" class="text-xl sm:text-2xl font-medium text-center">Japanese language school</p>
        <p id="kanjiSmall" class="serif absolute bottom-5 text-sm text-[var(--paper)]/50">日本語学校</p>
      </div>

    </div>
  </div>

  <!-- controls -->
  <div class="w-full max-w-md flex items-center justify-between mt-8 gap-3">
    <button id="prevBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">← 前</button>
    <button id="shuffleBtn" class="ctrl-btn px-4 py-3 rounded text-sm">シャッフル</button>
    <button id="nextBtn" class="ctrl-btn flex-1 py-3 rounded text-sm">次 →</button>
  </div>

  <p class="text-xs text-[var(--ink)]/40 mt-6">スペースキーで裏返す・矢印キーで移動</p>
  <p class="text-xs text-[var(--ink)]/30 mt-2">Made by <a href="https://andrewl.cv" target="_blank" rel="noopener" class="underline hover:text-[var(--seal)] transition-colors">DORU</a></p>

<script>
  const words = [
    ["日本語学校","にほんごがっこう","Japanese language school"],
    ["高校","こうこう","high school"],
    ["どれぐらい","どれぐらい","how long"],
    ["上手","じょうず","well / good at"],
    ["~間","~かん","for ~ (e.g. for two years)"],
    ["自分で","じぶんで","on my own"],
    ["まだまだです","まだまだです","Not even close."],
    ["そんなことないです","そんなことないです","Not really."],
    ["大学","だいがく","university / college"],
    ["ラジオ","ラジオ","radio"],
    ["ネット","ネット","Internet"],
    ["アプリ","アプリ","app / application"],
    ["日本語","にほんご","Japanese language"],
    ["勉強","べんきょう","study"],
    ["簡単","かんたん","easy"],
    ["難しい","むずかしい","difficult"],
    ["似ている","にている","similar"],
    ["違う","ちがう","different"],
    ["得意","とくい","good at"],
    ["苦手","にがて","poor at"],
    ["文法","ぶんぽう","grammar"],
    ["発音","はつおん","pronunciation"],
    ["文字","もじ","characters"],
    ["ひらがな","ひらがな","hiragana"],
    ["カタカナ","カタカナ","katakana"],
    ["漢字","かんじ","kanji"],
    ["会話","かいわ","conversation"],
    ["モンゴル語","モンゴルご","Mongolian language"],
    ["ベトナム語","ベトナムご","Vietnamese language"],
    ["覚える","おぼえる","to memorize"],
    ["教える","おしえる","to teach"],
    ["辞書","じしょ","dictionary"],
    ["貸す","かす","to lend"],
    ["見せる","みせる","to show"],
    ["チェックする","チェックする","to check"],
    ["説明する","せつめいする","to explain"],
    ["紙","かみ","paper"],
    ["書く","かく","to write"],
    ["言う","いう","to say / to tell"],
    ["ゆっくり","ゆっくり","slowly"],
    ["~方","~かた","how to (e.g. how to read)"],
    ["メール","メール","email"],
    ["書類","しょるい","document"],
    ["教科書","きょうかしょ","textbook"],
    ["自信がありません","じしんがありません","I am not confident."],
    ["練習","れんしゅう","practice"],
    ["探す","さがす","to look for"],
    ["何回も","なんかいも","several times"],
    ["教室","きょうしつ","classroom"],
    ["無料","むりょう","free of charge"],
    ["先生","せんせい","teacher / instructor"],
    ["知恵","ちえ","wisdom"],
    ["拝借する","はいしゃくする","to borrow"],
    ["サイト","サイト","(web)site"],
    ["トップ","トップ","top"],
    ["カテゴリー","カテゴリー","category"],
    ["ランキング","ランキング","ranking"],
    ["わし","わし","I (role language for an elderly person)"],
    ["検索","けんさく","search"],
    ["質問","しつもん","question"],
    ["相談","そうだん","discussion"],
    ["おしゃべりする","おしゃべりする","to chat"],
    ["シャドーイングする","シャドーイングする","to shadow"],
    ["ボランティア","ボランティア","volunteer"]
  ];

  let order = words.map((_, i) => i);
  let pos = 0;
  let flipped = false;

  const flipCard = document.getElementById('flipCard');
  const cardScene = document.getElementById('cardScene');
  const kanjiText = document.getElementById('kanjiText');
  const kanjiSmall = document.getElementById('kanjiSmall');
  const readingText = document.getElementById('readingText');
  const meaningText = document.getElementById('meaningText');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  document.getElementById('speakBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const [, reading] = words[order[pos]];
    speak(reading);
  });

  function render(){
    const [kanji, reading, meaning] = words[order[pos]];
    kanjiText.textContent = kanji;
    kanjiSmall.textContent = kanji;
    readingText.textContent = reading;
    meaningText.textContent = meaning;
    counter.textContent = `${pos + 1} / ${words.length}`;
    progressFill.style.width = `${((pos + 1) / words.length) * 100}%`;
  }

  function setFlipped(state){
    flipped = state;
    flipCard.classList.toggle('flipped', flipped);
  }

  function go(delta){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    setFlipped(false);
    pos = (pos + delta + order.length) % order.length;
    setTimeout(render, delta === 0 ? 0 : 120);
  }

  function shuffle(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    setFlipped(false);
    render();
  }

  cardScene.addEventListener('click', () => setFlipped(!flipped));
  document.getElementById('prevBtn').addEventListener('click', () => go(-1));
  document.getElementById('nextBtn').addEventListener('click', () => go(1));
  document.getElementById('shuffleBtn').addEventListener('click', shuffle);

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); setFlipped(!flipped); }
    if(e.code === 'ArrowRight'){ go(1); }
    if(e.code === 'ArrowLeft'){ go(-1); }
  });

  render();
</script>
</body>
</html>
