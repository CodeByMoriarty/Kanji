<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いろどり ことばカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F3ECDD;
    --ink:#2A241C;
    --seal:#A2403B;
    --indigo:#33506A;
    --gold:#B4893F;
    --line:#DED2B6;
  }
  body{ background:var(--paper); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .serif{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .paper-texture{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(180,137,63,0.06), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(51,80,106,0.06), transparent 45%);
  }
  .level-card{
    border:1px solid var(--line); background:#fff;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .level-card:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:0 14px 28px -18px rgba(42,36,28,0.4);
  }
  .level-card.active{
    border-color:var(--seal);
    box-shadow:0 14px 28px -18px rgba(162,64,59,0.35);
  }
  .badge{
    width:48px; height:48px; border:2px solid currentColor;
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; letter-spacing:.02em; flex-shrink:0;
  }
  @media (min-width: 640px){
    .badge{ width:60px; height:60px; font-size:22px; }
  }
  .lesson-card{
    border:1px solid var(--line); background:#fff;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .lesson-card:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
    background:var(--paper-deep);
  }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .hidden-panel{ display:none; }
  .chevron{
    width:18px; height:18px; color:var(--ink); opacity:.4;
    transition:transform .25s ease;
  }
  .level-card.expanded .chevron{ transform:rotate(180deg); opacity:.8; }
  .accordion-panel{
    grid-column:1 / -1;
    max-height:0; overflow:hidden;
    transition:max-height .35s ease;
  }
  .accordion-inner{ padding:14px 2px 20px; }
</style>
</head>
<body class="min-h-screen paper-texture text-[var(--ink)] flex flex-col items-center px-4 py-8 sm:px-6 sm:py-14">

  <!-- header -->
  <div class="text-center mb-8 sm:mb-14">
    <h1 class="serif text-2xl sm:text-5xl font-bold leading-tight">いろどり ことばカード</h1>
    <p class="text-xs sm:text-base text-[var(--ink)]/60 mt-2 sm:mt-3">レベルとレッスンを選んでください</p>
    <div class="hidden sm:block w-16 h-[2px] mx-auto mt-5" style="background:var(--gold);"></div>
  </div>

  <!-- picker section (vocab + grammar) -->
  <div id="pickerSection" class="w-full max-w-5xl flex flex-col items-center">

  <!-- level selection: vocabulary -->
  <p class="w-full text-xs sm:text-sm tracking-wide text-[var(--ink)]/50 mb-3 sm:mb-4 font-medium">ことば Vocabulary</p>
  <div id="levelSelect" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-10 sm:mb-14">
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="starter" data-prefix="s" data-count="18" data-labelformat="第{n}課">
      <div class="badge text-[var(--indigo)]">1</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 1</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">第1課〜第18課</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="a2" data-prefix="a" data-count="18" data-labelformat="第{n}課">
      <div class="badge text-[var(--seal)]">2</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 2</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">第1課〜第18課</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="irodori3" data-prefix="i" data-count="18" data-labelformat="第{n}課">
      <div class="badge text-[var(--gold)]">3</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 3</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">第1課〜第18課</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="mnn1" data-prefix="m" data-count="25" data-labelformat="Lesson {n}">
      <div class="badge" style="color:#6B7F4F;">M</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Minna no Nihongo 1</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">Lesson 1〜Lesson 25</p>
      </div>
    </button>
  </div>

  <!-- level selection: sentence patterns -->
  <p class="w-full text-xs sm:text-sm tracking-wide text-[var(--ink)]/50 mb-3 sm:mb-4 font-medium">文型 Sentence Patterns</p>
  <div id="grammarSelect" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="sg1" data-prefix="sg" data-count="18" data-labelformat="第{n}課">
      <div class="badge" style="color:#D1477A;">1</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 1</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">文型 Lesson 1〜18</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="sg2" data-prefix="ag" data-count="18" data-labelformat="第{n}課">
      <div class="badge" style="color:#C97A2B;">2</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 2</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">文型 Lesson 1〜18</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-4 sm:p-7 flex items-center gap-4 sm:gap-5 text-left w-full active:scale-95 transition-transform" data-level="sg3" data-prefix="ig" data-count="18" data-labelformat="第{n}課">
      <div class="badge" style="color:#B59B1D;">3</div>
      <div class="min-w-0">
        <p class="serif text-base sm:text-lg font-bold leading-snug">Irodori 3</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">文型 Lesson 1〜18</p>
      </div>
    </button>
  </div>

  </div>

  <!-- lesson grid -->
  <div id="lessonPanel" class="hidden-panel w-full max-w-5xl mt-6 sm:mt-10">
    <div class="flex items-center justify-between mb-5 sm:mb-7">
      <button id="backBtn" class="text-sm text-[var(--indigo)] hover:text-[var(--seal)] transition-colors">← レベルに戻る</button>
      <p id="levelLabel" class="serif text-sm sm:text-base text-[var(--ink)]/70"></p>
    </div>
    <div id="lessonGrid" class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-9 gap-3 sm:gap-4"></div>
  </div>

  <p class="text-xs text-[var(--ink)]/35 mt-12">Irodori 1・2・3 ・ Minna no Nihongo 1 フラッシュカード</p>
  <p class="text-xs text-[var(--ink)]/30 mt-2">Made by <a href="https://andrewl.cv" target="_blank" rel="noopener" class="underline hover:text-[var(--seal)] transition-colors">DORU</a></p>

<script>
  const pickerSection = document.getElementById('pickerSection');
  const lessonPanel = document.getElementById('lessonPanel');
  const lessonGrid = document.getElementById('lessonGrid');
  const levelLabel = document.getElementById('levelLabel');
  const backBtn = document.getElementById('backBtn');

  const levelNames = {
    starter: 'Irodori 1',
    a2: 'Irodori 2',
    irodori3: 'Irodori 3',
    mnn1: 'Minna no Nihongo 1',
    sg1: 'Irodori 1 文型',
    sg2: 'Irodori 2 文型',
    sg3: 'Irodori 3 文型'
  };

  const isMobile = () => window.matchMedia('(max-width: 639px)').matches;

  function buildLessonTiles(prefix, count, labelFormat){
    const wrap = document.createElement('div');
    wrap.className = 'grid grid-cols-3 sm:grid-cols-6 gap-3';
    for(let n = 1; n <= count; n++){
      const a = document.createElement('a');
      a.href = `${prefix}${n}.html`;
      a.className = 'lesson-card fade-in rounded-lg flex flex-col items-center justify-center py-5 active:scale-95 transition-transform';
      a.style.animationDelay = `${n * 0.02}s`;
      a.innerHTML = `
        <span class="serif text-2xl font-bold leading-none">${n}</span>
        <span class="text-[11px] text-[var(--ink)]/60 mt-1.5 text-center px-1">${labelFormat.replace('{n}', n)}</span>
      `;
      wrap.appendChild(a);
    }
    return wrap;
  }

  function showLessons(level, prefix, count, labelFormat){
    lessonGrid.innerHTML = '';
    levelLabel.textContent = levelNames[level];
    lessonGrid.appendChild(buildLessonTiles(prefix, count, labelFormat));

    pickerSection.classList.add('hidden-panel');
    lessonPanel.classList.remove('hidden-panel');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeAllAccordions(){
    document.querySelectorAll('.accordion-panel').forEach(panel => {
      panel.style.maxHeight = '0px';
      setTimeout(() => panel.remove(), 350);
    });
    document.querySelectorAll('.level-card.expanded').forEach(c => c.classList.remove('expanded'));
  }

  function toggleAccordion(card){
    const alreadyOpen = card.classList.contains('expanded');
    const existingPanel = card.nextElementSibling && card.nextElementSibling.classList.contains('accordion-panel')
      ? card.nextElementSibling : null;

    closeAllAccordions();

    if(alreadyOpen && existingPanel){
      // was open before this toggle call — just leave it closed
      return;
    }

    const count = parseInt(card.dataset.count, 10) || 18;
    const labelFormat = card.dataset.labelformat || '第{n}課';

    const panel = document.createElement('div');
    panel.className = 'accordion-panel';
    const inner = document.createElement('div');
    inner.className = 'accordion-inner';
    inner.appendChild(buildLessonTiles(card.dataset.prefix, count, labelFormat));
    panel.appendChild(inner);

    card.insertAdjacentElement('afterend', panel);
    card.classList.add('expanded');

    requestAnimationFrame(() => {
      panel.style.maxHeight = panel.scrollHeight + 'px';
    });
  }

  document.querySelectorAll('.level-card').forEach(card => {
    const chevron = document.createElement('svg');
    chevron.setAttribute('viewBox', '0 0 24 24');
    chevron.setAttribute('fill', 'none');
    chevron.setAttribute('stroke', 'currentColor');
    chevron.setAttribute('stroke-width', '2');
    chevron.className = 'chevron ml-auto sm:hidden';
    chevron.innerHTML = '<path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>';
    card.appendChild(chevron);

    card.addEventListener('click', () => {
      if(isMobile()){
        toggleAccordion(card);
      } else {
        const count = parseInt(card.dataset.count, 10) || 18;
        const labelFormat = card.dataset.labelformat || '第{n}課';
        showLessons(card.dataset.level, card.dataset.prefix, count, labelFormat);
      }
    });
  });

  window.matchMedia('(max-width: 639px)').addEventListener('change', (e) => {
    if(!e.matches) closeAllAccordions();
  });

  backBtn.addEventListener('click', () => {
    lessonPanel.classList.add('hidden-panel');
    pickerSection.classList.remove('hidden-panel');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
