<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いろどり ことばカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-deep:#F3ECDD;
    --ink:#2A241C;
    --seal:#A2403B;
    --indigo:#33506A;
    --gold:#B4893F;
    --line:#DED2B6;
  }
  body{ background:var(--paper); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .serif{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .paper-texture{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(180,137,63,0.06), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(51,80,106,0.06), transparent 45%);
  }
  .level-card{
    border:1px solid var(--line); background:#fff;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .level-card:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
    box-shadow:0 14px 28px -18px rgba(42,36,28,0.4);
  }
  .level-card.active{
    border-color:var(--seal);
    box-shadow:0 14px 28px -18px rgba(162,64,59,0.35);
  }
  .badge{
    width:52px; height:52px; border:2px solid currentColor;
    border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:13px; letter-spacing:.02em; transform:rotate(-2deg);
  }
  .lesson-card{
    border:1px solid var(--line); background:#fff;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .lesson-card:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
    background:var(--paper-deep);
  }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .hidden-panel{ display:none; }
</style>
</head>
<body class="min-h-screen paper-texture text-[var(--ink)] flex flex-col items-center px-5 py-12">

  <!-- header -->
  <div class="text-center mb-10">
    <h1 class="serif text-3xl sm:text-4xl font-bold">いろどり ことばカード</h1>
    <p class="text-sm text-[var(--ink)]/60 mt-2">レベルとレッスンを選んでください</p>
  </div>

  <!-- level selection -->
  <div id="levelSelect" class="w-full max-w-2xl grid grid-cols-1 sm:grid-cols-2 gap-5">
    <button class="level-card rounded-lg p-6 flex items-center gap-4 text-left" data-level="starter" data-prefix="s">
      <div class="badge text-[var(--indigo)]">1</div>
      <div>
        <p class="serif text-lg font-bold">Irodori 1</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">第1課〜第18課</p>
      </div>
    </button>
    <button class="level-card rounded-lg p-6 flex items-center gap-4 text-left" data-level="a2" data-prefix="a">
      <div class="badge text-[var(--seal)]">2</div>
      <div>
        <p class="serif text-lg font-bold">Irodori 2</p>
        <p class="text-xs text-[var(--ink)]/60 mt-1">第1課〜第18課</p>
      </div>
    </button>
  </div>

  <!-- lesson grid -->
  <div id="lessonPanel" class="hidden-panel w-full max-w-2xl mt-10">
    <div class="flex items-center justify-between mb-5">
      <button id="backBtn" class="text-sm text-[var(--indigo)] hover:text-[var(--seal)] transition-colors">← レベルに戻る</button>
      <p id="levelLabel" class="serif text-sm text-[var(--ink)]/70"></p>
    </div>
    <div id="lessonGrid" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div>
  </div>

  <p class="text-xs text-[var(--ink)]/35 mt-12">Irodori 1 &amp; 2 フラッシュカード</p>
  <p class="text-xs text-[var(--ink)]/30 mt-2">Made by <a href="https://andrewl.cv" target="_blank" rel="noopener" class="underline hover:text-[var(--seal)] transition-colors">DORU</a></p>

<script>
  const levelSelect = document.getElementById('levelSelect');
  const lessonPanel = document.getElementById('lessonPanel');
  const lessonGrid = document.getElementById('lessonGrid');
  const levelLabel = document.getElementById('levelLabel');
  const backBtn = document.getElementById('backBtn');

  const levelNames = {
    starter: 'Irodori 1',
    a2: 'Irodori 2'
  };

  function showLessons(level, prefix){
    lessonGrid.innerHTML = '';
    levelLabel.textContent = levelNames[level];

    for(let n = 1; n <= 18; n++){
      const a = document.createElement('a');
      a.href = `${prefix}${n}.html`;
      a.className = 'lesson-card fade-in rounded-md flex flex-col items-center justify-center py-4';
      a.style.animationDelay = `${n * 0.02}s`;
      a.innerHTML = `
        <span class="serif text-xl font-bold">${n}</span>
        <span class="text-[10px] text-[var(--ink)]/50 mt-1">第${n}課</span>
      `;
      lessonGrid.appendChild(a);
    }

    levelSelect.classList.add('hidden-panel');
    lessonPanel.classList.remove('hidden-panel');
  }

  levelSelect.querySelectorAll('.level-card').forEach(card => {
    card.addEventListener('click', () => {
      showLessons(card.dataset.level, card.dataset.prefix);
    });
  });

  backBtn.addEventListener('click', () => {
    lessonPanel.classList.add('hidden-panel');
    levelSelect.classList.remove('hidden-panel');
  });
</script>
</body>
</html>
