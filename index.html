<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nihongo Cards — Japanese Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --paper-deep:#F3ECDD; --ink:#2A241C; --line:#E4D8BE; --seal:#A2403B; --gold:#B4893F;
  }
  html{ scroll-behavior:smooth; }
  body{ background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New', system-ui, sans-serif; }
  .paper{
    background-image:
      radial-gradient(circle at 12% 8%, rgba(180,137,63,.08), transparent 40%),
      radial-gradient(circle at 92% 90%, rgba(51,80,106,.07), transparent 45%);
  }
  .series-card{ transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .series-card:hover{ transform:translateY(-2px); box-shadow:0 14px 28px -18px rgba(42,36,28,.45); }
  .series-card:active{ transform:scale(.98); }
  .series-card.is-open{ box-shadow:0 0 0 2px var(--c); border-color:var(--c); }
  .chev{ transition:transform .25s ease; }
  .is-open .chev{ transform:rotate(180deg); }
  .panel{ animation:pop .25s ease both; }
  @keyframes pop{ from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none} }
  .tile{ transition:transform .12s ease, background .12s ease, border-color .12s ease; }
  a.tile:hover{ background:var(--paper-deep); border-color:var(--c); transform:translateY(-2px); }
  a.tile:active{ transform:scale(.95); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body class="paper min-h-screen">

  <!-- top bar -->
  <header class="border-b border-[var(--line)] bg-[var(--paper)]/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-[var(--ink)] text-[var(--paper)] flex items-center justify-center font-black text-lg">あ</span>
        <span class="font-bold tracking-tight">Nihongo Cards</span>
      </div>
      <span class="hidden sm:inline text-xs text-[var(--ink)]/50">日本語フラッシュカード</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-16">

    <!-- hero -->
    <section class="text-center pt-10 pb-8 sm:pt-16 sm:pb-12">
      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight leading-tight">Japanese Flashcards</h1>
      <p class="mt-3 sm:mt-4 text-sm sm:text-lg text-[var(--ink)]/60 max-w-2xl mx-auto">
        Vocabulary and sentence patterns, lesson by lesson. Pick a book, pick a lesson, flip the cards.
      </p>
    </section>

    <!-- tabs -->
    <div class="flex justify-center mb-8 sm:mb-10">
      <div id="tabs" class="inline-flex p-1 rounded-full bg-[var(--paper-deep)] border border-[var(--line)] w-full sm:w-auto" role="tablist">
        <button data-tab="vocab" role="tab" class="tab flex-1 sm:flex-none px-5 sm:px-8 py-2.5 rounded-full text-sm font-medium transition">
          ことば <span class="text-xs opacity-60">Vocabulary</span>
        </button>
        <button data-tab="grammar" role="tab" class="tab flex-1 sm:flex-none px-5 sm:px-8 py-2.5 rounded-full text-sm font-medium transition">
          文型 <span class="text-xs opacity-60">Sentence Patterns</span>
        </button>
      </div>
    </div>

    <!-- series grid + panel -->
    <section id="seriesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5"></section>
    <div id="desktopPanelSlot" class="mt-5"></div>

    <footer class="mt-16 text-center text-xs text-[var(--ink)]/40 space-y-1">
      <p>Irodori 1・2・3 &nbsp;·&nbsp; Minna no Nihongo 1</p>
      <p>Made by <a href="https://andrewl.cv" target="_blank" rel="noopener" class="underline hover:text-[var(--seal)]">DORU</a></p>
    </footer>
  </main>

<script>
  // label: lesson tile subtitle; avail: lessons that actually exist (others shown as "coming soon")
  const SERIES = {
    vocab: [
      { id:'v1', name:'Irodori 1',          sub:'入門 · Starter',      prefix:'s',  count:18, avail:18, label:'第{n}課',    color:'#33506A', badge:'1' },
      { id:'v2', name:'Irodori 2',          sub:'初級1 · Elementary 1', prefix:'a',  count:18, avail:18, label:'第{n}課',    color:'#A2403B', badge:'2' },
      { id:'v3', name:'Irodori 3',          sub:'初級2 · Elementary 2', prefix:'i',  count:18, avail:18, label:'第{n}課',    color:'#B4893F', badge:'3' },
      { id:'vm', name:'Minna no Nihongo 1', sub:'みんなの日本語 I',      prefix:'m',  count:25, avail:25, label:'Lesson {n}', color:'#6B7F4F', badge:'M' }
    ],
    grammar: [
      { id:'g1', name:'Irodori 1', sub:'入門 · Sentence patterns',      prefix:'sg', count:18, avail:18, label:'第{n}課', color:'#D1477A', badge:'1' },
      { id:'g2', name:'Irodori 2', sub:'初級1 · Sentence patterns',     prefix:'ag', count:18, avail:9,  label:'第{n}課', color:'#C97A2B', badge:'2' },
      { id:'g3', name:'Irodori 3', sub:'初級2 · Sentence patterns',     prefix:'ig', count:18, avail:18, label:'第{n}課', color:'#B59B1D', badge:'3' }
    ]
  };

  const grid = document.getElementById('seriesGrid');
  const slot = document.getElementById('desktopPanelSlot');
  const tabButtons = document.querySelectorAll('.tab');
  let currentTab = 'vocab';
  let openId = null;

  const isCompact = () => window.matchMedia('(max-width: 639px)').matches;

  function setTabStyles(){
    tabButtons.forEach(b => {
      const on = b.dataset.tab === currentTab;
      b.classList.toggle('bg-[var(--ink)]', on);
      b.classList.toggle('text-[var(--paper)]', on);
      b.classList.toggle('shadow', on);
      b.setAttribute('aria-selected', on);
    });
  }

  function closePanel(){
    document.querySelectorAll('.panel').forEach(p => p.remove());
    document.querySelectorAll('.series-card.is-open').forEach(c => c.classList.remove('is-open'));
    openId = null;
  }

  function buildPanel(s){
    const panel = document.createElement('div');
    panel.className = 'panel col-span-full rounded-2xl bg-white border p-4 sm:p-6';
    panel.style.borderColor = s.color;
    panel.style.setProperty('--c', s.color);

    const tiles = [];
    for(let n = 1; n <= s.count; n++){
      const label = s.label.replace('{n}', n);
      if(n <= s.avail){
        tiles.push(`<a href="${s.prefix}${n}.html" class="tile rounded-xl border border-[var(--line)] bg-white py-3 sm:py-4 flex flex-col items-center justify-center" style="--c:${s.color}">
          <span class="text-xl sm:text-2xl font-bold leading-none" style="color:${s.color}">${n}</span>
          <span class="text-[10px] sm:text-xs text-[var(--ink)]/50 mt-1">${label}</span></a>`);
      } else {
        tiles.push(`<div class="rounded-xl border border-dashed border-[var(--line)] py-3 sm:py-4 flex flex-col items-center justify-center opacity-45" title="Coming soon">
          <span class="text-xl sm:text-2xl font-bold leading-none">${n}</span>
          <span class="text-[10px] sm:text-xs mt-1">soon</span></div>`);
      }
    }

    panel.innerHTML = `
      <div class="flex items-center justify-between mb-4">
        <div>
          <p class="font-bold text-base sm:text-lg" style="color:${s.color}">${s.name}</p>
          <p class="text-xs text-[var(--ink)]/50">${s.sub} · ${s.avail} lessons</p>
        </div>
        <button class="close-panel text-xs sm:text-sm px-3 py-1.5 rounded-full border border-[var(--line)] hover:bg-[var(--paper-deep)]">Close ✕</button>
      </div>
      <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-9 gap-2 sm:gap-3">${tiles.join('')}</div>`;
    panel.querySelector('.close-panel').addEventListener('click', closePanel);
    return panel;
  }

  function openSeries(s, card){
    const wasOpen = openId === s.id;
    closePanel();
    if(wasOpen) return;
    openId = s.id;
    card.classList.add('is-open');
    const panel = buildPanel(s);
    if(isCompact()){
      card.insertAdjacentElement('afterend', panel);   // accordion directly under the tapped card
    } else {
      slot.appendChild(panel);                          // below the grid on tablet / desktop
    }
    panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function renderSeries(){
    closePanel();
    grid.innerHTML = '';
    SERIES[currentTab].forEach(s => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'series-card text-left w-full rounded-2xl bg-white border border-[var(--line)] p-4 sm:p-5 flex items-center gap-4';
      card.style.setProperty('--c', s.color);
      card.innerHTML = `
        <span class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center text-xl sm:text-2xl font-black shrink-0 text-white" style="background:${s.color}">${s.badge}</span>
        <span class="min-w-0 flex-1">
          <span class="block font-bold text-base sm:text-lg leading-snug">${s.name}</span>
          <span class="block text-xs text-[var(--ink)]/55 mt-0.5">${s.sub}</span>
          <span class="block text-[11px] text-[var(--ink)]/40 mt-1">${s.avail} lessons</span>
        </span>
        <svg class="chev w-5 h-5 shrink-0 text-[var(--ink)]/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      card.addEventListener('click', () => openSeries(s, card));
      grid.appendChild(card);
    });
  }

  tabButtons.forEach(b => b.addEventListener('click', () => {
    currentTab = b.dataset.tab;
    setTabStyles();
    renderSeries();
  }));

  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });
  window.matchMedia('(max-width: 639px)').addEventListener('change', closePanel);

  setTabStyles();
  renderSeries();
</script>
</body>
</html>
